services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro

  api:
    build: .
    restart: unless-stopped
    depends_on:
      - db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    ports:
      - "${API_PORT:-8000}:8000"

  worker:
    build: .
    restart: unless-stopped
    depends_on:
      - db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      FIRMS_MAP_KEY: ${FIRMS_MAP_KEY}
      FIRMS_BBOX: ${FIRMS_BBOX:-68,6,98,38}
      FIRMS_SOURCES: ${FIRMS_SOURCES:-VIIRS_NOAA20_NRT,VIIRS_NOAA21_NRT}
      FIRMS_DAYS: ${FIRMS_DAYS:-2}
      FIRMS_POLL_INTERVAL_MIN: ${FIRMS_POLL_INTERVAL_MIN:-10}
      WORKER_OSM_CONTEXT: ${WORKER_OSM_CONTEXT:-0}
    command: ["python", "scripts/worker.py"]

volumes:
  pgdata: