<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SIH — Thermal Anomaly MVP</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root {
    --industrial-fire: #d32f2f;
    --persistent-industrial-source: #fb8c00;
    --gas-flare: #fbc02d;
    --non-industrial: #2e7d32;
    --unknown: #616161;
    --unclassified: #9e9e9e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; background: #f5f5f5; }
  #map { position: absolute; inset: 0 0 0 320px; }
  #sidebar {
    position: absolute; top: 0; left: 0; bottom: 0; width: 320px;
    background: #fff; border-right: 1px solid #ddd; overflow-y: auto; padding: 16px;
  }
  h1 { font-size: 17px; margin: 0 0 4px; }
  .sub { color: #666; font-size: 12px; margin-bottom: 12px; }
  .stats { font-size: 12px; color: #333; margin-bottom: 14px; line-height: 1.6; }
  .stats b { color: #111; }
  .filters { margin-bottom: 14px; }
  .filters button {
    display: inline-block; margin: 2px; padding: 4px 10px; font-size: 12px;
    border: 1px solid #ccc; border-radius: 14px; cursor: pointer; background: #fff;
  }
  .filters button.active { color: #fff; border-color: #333; background: #333; }
  .filters button .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; }
  .legend { font-size: 12px; color: #555; margin-bottom: 14px; }
  .legend div { margin: 3px 0; }
  .legend .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; }
  #detail { font-size: 13px; }
  #detail h2 { font-size: 14px; margin: 6px 0; }
  #detail .row { display: flex; justify-content: space-between; padding: 3px 0; border-bottom: 1px dashed #eee; }
  #detail .row span:first-child { color: #666; }
  #detail .reasons { margin-top: 8px; padding-left: 16px; color: #333; }
  #detail .reasons li { margin: 3px 0; }
  .badge {
    display: inline-block; padding: 2px 9px; border-radius: 12px; color: #fff; font-size: 11px; font-weight: 600;
  }
  .empty { color: #999; font-size: 12px; }
  .leaflet-popup-content { max-width: 260px; }
  .leaflet-popup-content .p { margin: 2px 0; font-size: 12px; }
</style>
</head>
<body>
<div id="sidebar">
  <h1>SIH Thermal Anomaly MVP</h1>
  <div class="sub">FIRMS hotspots · industrial-context classification</div>
  <div class="stats" id="stats">Loading stats…</div>

  <div class="filters">
    <div class="sub">Classification filter</div>
    <button class="active" data-class="">All</button>
    <button data-class="industrial_fire"><span class="dot" style="background:var(--industrial-fire)"></span>Industrial fire</button>
    <button data-class="persistent_industrial_source"><span class="dot" style="background:var(--persistent-industrial-source)"></span>Persistent source</button>
    <button data-class="gas_flare"><span class="dot" style="background:var(--gas-flare)"></span>Gas flare</button>
    <button data-class="non_industrial"><span class="dot" style="background:var(--non-industrial)"></span>Non-industrial</button>
    <button data-class="unknown"><span class="dot" style="background:var(--unknown)"></span>Unknown</button>
  </div>

  <div class="legend">
    <div><span class="dot" style="background:var(--industrial-fire)"></span>industrial_fire</div>
    <div><span class="dot" style="background:var(--persistent-industrial-source)"></span>persistent_industrial_source</div>
    <div><span class="dot" style="background:var(--gas-flare)"></span>gas_flare</div>
    <div><span class="dot" style="background:var(--non-industrial)"></span>non_industrial</div>
    <div><span class="dot" style="background:var(--unknown)"></span>unknown</div>
  </div>

  <div id="detail"><p class="empty">Click a marker to see details.</p></div>
</div>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const COLORS = {
  industrial_fire: "#d32f2f",
  persistent_industrial_source: "#fb8c00",
  gas_flare: "#fbc02d",
  non_industrial: "#2e7d32",
  unknown: "#616161",
  unclassified: "#9e9e9e",
};
const FMT_M = (m) => (m == null ? "—" : m >= 1000 ? (m / 1000).toFixed(1) + " km" : Math.round(m) + " m");

const map = L.map("map").setView([22, 82], 5);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 18,
  attribution: "&copy; OpenStreetMap contributors",
}).addTo(map);

let layer = L.layerGroup().addTo(map);

function badge(cls) {
  const c = COLORS[cls] || COLORS.unclassified;
  return '<span class="badge" style="background:' + c + '">' + cls + "</span>";
}

function renderFeatures(data) {
  layer.clearLayers();
  if (!data || !data.features || data.features.length === 0) {
    L.popup({ maxWidth: 400 }).setLatLng(map.getCenter())
      .setContent('<div class="p">No hotspots for this filter.</div>').openOn(map);
    return;
  }
  for (const f of data.features) {
    const p = f.properties;
    const cls = p.class || "unclassified";
    const color = COLORS[cls] || COLORS.unclassified;
    const [lon, lat] = f.geometry.coordinates;
    L.circleMarker([lat, lon], {
      radius: 6, color: "#fff", weight: 1, fillColor: color, fillOpacity: 0.9,
    })
      .addTo(layer)
      .bindPopup(
        "<b>" + badge(cls) + "</b>" +
        '<div class="p"><b>FRP:</b> ' + (p.frp == null ? "—" : p.frp.toFixed(2)) + "</div>" +
        '<div class="p"><b>Date/time:</b> ' + p.acq_date + " " + String(p.acq_time).padStart(4, "0") + "</div>" +
        '<div class="p"><b>Confidence:</b> ' + (p.confidence || "—") + "</div>" +
        '<div class="p"><b>Nearest facility:</b> ' + (p.nearest_facility_name || p.nearest_facility_type || "—") + "</div>" +
        '<div class="p"><b>Distance:</b> ' + FMT_M(p.distance_m) + "</div>" +
        '<div class="p"><b>Persistence:</b> ' + p.persistence_score.toFixed(2) + " (" + p.nearby_detections_7d + " in 7d)</div>"
      )
      .on("click", () => loadDetail(p.id));
  }
  if (data.features.length === 1) map.fitBounds(layer.getBounds(), { maxZoom: 9 });
}

function loadHotspots(cls) {
  const url = "/api/hotspots.geojson" + (cls ? "?class=" + encodeURIComponent(cls) : "");
  fetch(url).then(r => r.json()).then(renderFeatures).catch(err => console.error(err));
}

function loadDetail(id) {
  fetch("/api/hotspots/" + id).then(r => r.json()).then(d => {
    const e = d.enrichment || {};
    const rows = [
      ["Source", d.source + " / " + d.satellite],
      ["Date/time", d.acq_date + " " + String(d.acq_time || 0).padStart(4, "0")],
      ["FRP", d.frp == null ? "—" : d.frp.toFixed(2)],
      ["Confidence", d.confidence || "—"],
      ["Coordinates", d.latitude.toFixed(4) + ", " + d.longitude.toFixed(4)],
      ["Nearest facility", e.nearest_facility_name || e.nearest_facility_type || "—"],
      ["Distance", FMT_M(e.distance_m)],
      ["Inside facility?", e.within_facility ? "yes" : "no"],
      ["Detections (7d)", e.nearby_detections_7d ?? 0],
      ["Persistence", (e.persistence_score ?? 0).toFixed(2)],
      ["FRP vs nearby", e.frp_vs_nearby == null ? "—" : e.frp_vs_nearby.toFixed(2)],
    ];
    document.getElementById("detail").innerHTML =
      "<h2>" + badge(e.class || "unclassified") + "</h2>" +
      rows.map(r => '<div class="row"><span>' + r[0] + "</span><span>" + r[1] + "</span></div>").join("") +
      "<h2>Why</h2><ul class='reasons'>" +
      (e.reasons && e.reasons.length ? e.reasons.map(r => "<li>" + r + "</li>").join("") : "<li>no reasons</li>") +
      "</ul>";
  }).catch(() => {
    document.getElementById("detail").innerHTML = '<p class="empty">Could not load detail.</p>';
  });
}

function loadStats() {
  fetch("/api/stats").then(r => r.json()).then(s => {
    const bc = s.by_class || {};
    const list = Object.entries(bc).map(([k, v]) => k + ": " + v).join(" · ");
    document.getElementById("stats").innerHTML =
      "<b>" + s.total_hotspots + "</b> hotspots · <b>" + s.total_facilities + "</b> industrial facilities<br>" +
      (list || "no classifications yet");
  }).catch(() => {
    document.getElementById("stats").textContent = "Stats unavailable.";
  });
}

document.querySelectorAll(".filters button").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".filters button").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    loadHotspots(btn.dataset.class);
  });
});

loadStats();
loadHotspots("");
</script>
</body>
</html>
