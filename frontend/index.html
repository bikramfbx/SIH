<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SIH — Thermal Anomaly Monitor</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root {
    --industrial-fire: #d32f2f;
    --persistent-industrial-source: #fb8c00;
    --gas-flare: #fbc02d;
    --industrial-fire: #d32f2f;
    --unknown: #616161;
    --unclassified: #9e9e9e;
    --bg: #070a12;
    --panel: rgba(10, 15, 28, 0.97);
    --hairline: rgba(150, 175, 220, 0.14);
    --ink: #e6e9f4;
    --dim: #93a0b8;
    --faint: #5c6b85;
    --accent: #ffd700;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif;
    background: var(--bg); color: var(--ink); }
  #map { position: absolute; inset: 0 0 0 320px; background: var(--bg); }

  /* Darken the keyless Esri dark-gray canvas toward a faint navy backdrop. */
  .tile-dark .leaflet-tile {
    filter: brightness(0.55) contrast(1.08) sepia(0.45) hue-rotate(200deg) saturate(1.6);
  }

  #sidebar {
    position: absolute; top: 0; left: 0; bottom: 0; width: 320px;
    background: var(--panel);
    border-right: 1px solid var(--hairline);
    overflow-y: auto; padding: 16px;
  }
  h1 { font-size: 17px; margin: 0 0 4px; letter-spacing: 0.02em; }
  #sidebar h1::before { content: "▮ "; color: var(--accent); }
  .sub { color: var(--dim); font-size: 12px; margin-bottom: 12px; }
  .stats { font-size: 12px; color: var(--ink); margin-bottom: 14px; line-height: 1.6; }
  .stats b { color: var(--accent); font-weight: 600; }

  .filters { margin-bottom: 14px; }
  .filters button {
    display: inline-block; margin: 2px; padding: 4px 10px; font-size: 12px;
    border: 1px solid rgba(150, 175, 220, 0.25); border-radius: 14px;
    cursor: pointer; background: rgba(255, 255, 255, 0.03); color: var(--ink);
  }
  .filters button:hover { border-color: rgba(150, 175, 220, 0.5); }
  .filters button.active { color: #0a0a0a; border-color: #fff; background: #fff; }
  .filters button[data-class="industrial_fire"].active,
  .filters button[data-class="persistent_industrial_source"].active,
  .filters button[data-class="gas_flare"].active,
  .filters button[data-class="unknown"].active {
    border-color: transparent; color: #fff;
    background: var(--industrial-fire);
  }
  .filters button[data-class="persistent_industrial_source"].active { background: var(--persistent-industrial-source); }
  .filters button[data-class="gas_flare"].active { background: var(--gas-flare); }
  .filters button[data-class="unknown"].active { background: var(--unknown); }
  .filters button .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px;
    vertical-align: baseline; box-shadow: 0 0 5px currentColor; }

  .legend { font-size: 12px; color: var(--dim); margin-bottom: 14px; }
  .legend div { margin: 3px 0; }
  .legend .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; }

  #detail { font-size: 13px; }
  #detail h2 { font-size: 14px; margin: 14px 0 6px; color: var(--ink); }
  #detail .row { display: flex; justify-content: space-between; padding: 3px 0;
    border-bottom: 1px dashed rgba(150, 175, 220, 0.16); }
  #detail .row span:first-child { color: var(--dim); }
  #detail .row span:last-child { text-align: right; padding-left: 12px; }
  #detail .reasons { margin-top: 8px; padding-left: 16px; color: var(--ink); }
  #detail .reasons li { margin: 3px 0; }
  .badge {
    display: inline-block; padding: 2px 9px; border-radius: 12px; color: #fff;
    font-size: 11px; font-weight: 600; text-transform: lowercase;
  }
  .empty { color: var(--faint); font-size: 12px; }

  .leaflet-popup-content { max-width: 260px; }
  .leaflet-popup-content-wrapper {
    background: rgba(10, 15, 28, 0.97); color: var(--ink);
    border: 1px solid rgba(150, 175, 220, 0.3); border-radius: 3px;
  }
  .leaflet-popup-tip { background: rgba(10, 15, 28, 0.97); }
  .leaflet-popup-content .p { margin: 2px 0; font-size: 12px; }
  .leaflet-popup-content .p b { color: var(--dim); font-weight: 500; }
  .leaflet-bar a { background: #0f1626; color: var(--ink); }
  .leaflet-bar a:hover { background: #16213a; }
</style>
</head>
<body>
<div id="sidebar">
  <h1>SIH Thermal Anomaly Monitor</h1>
  <div class="sub">FIRMS VIIRS NRT · industrial-context classification</div>
  <div class="stats" id="stats">Loading stats…</div>

  <div class="filters">
    <div class="sub">Classification filter</div>
    <button class="active" data-class="">All</button>
    <button data-class="industrial_fire"><span class="dot" style="background:var(--industrial-fire)"></span>Industrial fire</button>
    <button data-class="persistent_industrial_source"><span class="dot" style="background:var(--persistent-industrial-source)"></span>Persistent source</button>
    <button data-class="gas_flare"><span class="dot" style="background:var(--gas-flare)"></span>Gas flare</button>
    <button data-class="unknown"><span class="dot" style="background:var(--unknown)"></span>Unknown</button>
  </div>

  <div class="legend">
    <div><span class="dot" style="background:var(--industrial-fire)"></span>industrial_fire</div>
    <div><span class="dot" style="background:var(--persistent-industrial-source)"></span>persistent_industrial_source</div>
    <div><span class="dot" style="background:var(--gas-flare)"></span>gas_flare</div>
    <div><span class="dot" style="background:var(--unknown)"></span>unknown</div>
  </div>

  <div id="detail"><p class="empty">Click a marker to see details.</p></div>
</div>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const COLORS = {
  industrial_fire: "#d32f2f",
  persistent_industrial_source: "#fb8c00",
  gas_flare: "#fbc02d",
  unknown: "#616161",
  unclassified: "#9e9e9e",
};
const FMT_M = (m) => (m == null ? "—" : m >= 1000 ? (m / 1000).toFixed(1) + " km" : Math.round(m) + " m");

function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

const map = L.map("map", { maxZoom: 17 }).setView([22, 82], 5);
L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}", {
  maxZoom: 17,
  className: "tile-dark",
  attribution: "Tiles &copy; <a href=\"https://www.esri.com/en-us/legal/terms/full-master-agreement\">Esri</a> &mdash; Esri, Maxar, Earthstar Geographics",
}).addTo(map);
L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}", {
  maxZoom: 17,
}).addTo(map);

let layer = L.layerGroup().addTo(map);

function badge(cls) {
  const c = COLORS[cls] || COLORS.unclassified;
  return '<span class="badge" style="background:' + c + '">' + esc(cls) + "</span>";
}

function renderFeatures(data) {
  layer.clearLayers();
  if (!data || !data.features || data.features.length === 0) {
    L.popup({ maxWidth: 400 }).setLatLng(map.getCenter())
      .setContent('<div class="p">No hotspots for this filter.</div>').openOn(map);
    return;
  }
  for (const f of data.features) {
    const p = f.properties;
    const cls = p.class || "unclassified";
    const color = COLORS[cls] || COLORS.unclassified;
    const [lon, lat] = f.geometry.coordinates;
    L.circleMarker([lat, lon], {
      radius: 6, color: "#fff", weight: 1, fillColor: color, fillOpacity: 0.9,
    })
      .addTo(layer)
      .bindPopup(
        "<b>" + badge(cls) + "</b>" +
        '<div class="p"><b>FRP:</b> ' + (p.frp == null ? "—" : p.frp.toFixed(2)) + "</div>" +
        '<div class="p"><b>Date/time:</b> ' + (p.acq_datetime || "—") + "</div>" +
        '<div class="p"><b>Confidence:</b> ' + esc(p.confidence || "—") + "</div>" +
        '<div class="p"><b>Nearest facility:</b> ' + esc(p.nearest_facility_name || p.nearest_facility_type || "—") + "</div>" +
        '<div class="p"><b>Distance:</b> ' + FMT_M(p.distance_m) + "</div>" +
        '<div class="p"><b>Persistence:</b> ' + (p.persistence_score == null ? "—" : p.persistence_score.toFixed(2)) +
        " (" + (p.detections_7d ?? 0) + " in 7d)</div>"
      )
      .on("click", () => loadDetail(p.id));
  }
  if (data.features.length === 1) map.fitBounds(layer.getBounds(), { maxZoom: 9 });
}

function loadHotspots(cls) {
  const url = "/api/hotspots.geojson" + (cls ? "?class=" + encodeURIComponent(cls) : "");
  fetch(url).then(r => r.json()).then(renderFeatures).catch(err => console.error(err));
}

function loadDetail(id) {
  fetch("/api/hotspots/" + id).then(r => r.json()).then(d => {
    const e = d.enrichment || {};
    const rows = [
      ["Source", esc(d.source + " / " + d.satellite)],
      ["Date/time", esc(d.acq_datetime || "—")],
      ["FRP", d.frp == null ? "—" : d.frp.toFixed(2)],
      ["Confidence", esc(d.confidence || "—")],
      ["Coordinates", (d.latitude ?? 0).toFixed(4) + ", " + (d.longitude ?? 0).toFixed(4)],
      ["Nearest facility", esc(e.nearest_facility_name || e.nearest_facility_type || "—")],
      ["Distance", FMT_M(e.distance_m)],
      ["Inside facility?", e.within_facility ? "yes" : "no"],
      ["Detections (7d)", e.detections_7d ?? 0],
      ["Active days (30d)", e.days_active_30d ?? 0],
      ["Persistence", (e.persistence_score ?? 0).toFixed(2)],
      ["FRP vs nearby", e.frp_vs_nearby == null ? "—" : e.frp_vs_nearby.toFixed(2)],
    ];
    document.getElementById("detail").innerHTML =
      "<h2>" + badge(e.class || "unclassified") + "</h2>" +
      rows.map(r => '<div class="row"><span>' + r[0] + "</span><span>" + r[1] + "</span></div>").join("") +
      "<h2>Why</h2><ul class='reasons'>" +
      (e.reasons && e.reasons.length ? e.reasons.map(r => "<li>" + esc(r) + "</li>").join("") : "<li>no reasons</li>") +
      "</ul>";
  }).catch(() => {
    document.getElementById("detail").innerHTML = '<p class="empty">Could not load detail.</p>';
  });
}

function loadStats() {
  fetch("/api/stats").then(r => r.json()).then(s => {
    const bc = s.by_class || {};
    const list = Object.entries(bc).map(([k, v]) => k + ": " + v).join(" · ");
    document.getElementById("stats").innerHTML =
      "<b>" + s.total_hotspots + "</b> hotspots · <b>" + s.total_facilities + "</b> industrial facilities<br>" +
      (list || "no classifications yet");
  }).catch(() => {
    document.getElementById("stats").textContent = "Stats unavailable.";
  });
}

document.querySelectorAll(".filters button").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".filters button").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    loadHotspots(btn.dataset.class);
  });
});

loadStats();
loadHotspots("");
</script>
</body>
</html>
